<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Langga ❤️</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffd9e5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            color: #e83e70;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        button {
            background: #e83e70;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Hi Langga ❤️</h1>

    <p>
        May gusto lang akong sabihin sa'yo...
    </p>

    <button onclick="showMessage()">
        Click mo ako 💌
    </button>

    <p id="message"></p>
</div>

<script>
    function showMessage() {
        document.getElementById("message").innerHTML =
        "I love you so much! ❤️ Thank you for always being there.";
    }
</script>

</body>
</html>
